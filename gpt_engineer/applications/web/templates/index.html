<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT Engineer Web UI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Left Panel - Chat Area */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #30363d;
            background-color: #161b22;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #30363d;
            background-color: #21262d;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 600;
            color: #f0f6fc;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #21262d;
            border: 1px solid #30363d;
        }

        .message.user {
            background-color: #1f6feb;
            border-color: #1f6feb;
            color: white;
        }

        .message.agent {
            background-color: #21262d;
            border-color: #30363d;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 12px;
            opacity: 0.7;
        }

        .message-content {
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.clickable {
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .message.clickable:hover {
            background-color: #1c2128;
        }

        .message-files-indicator {
            margin-top: 8px;
            font-size: 12px;
            color: #1f6feb;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message-files-indicator::before {
            content: "📁";
            font-size: 14px;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 15px;
            color: #8b949e;
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #8b949e;
            animation: loading 1.4s infinite ease-in-out;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes loading {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #30363d;
            background-color: #21262d;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            min-height: 60px;
            max-height: 120px;
            padding: 15px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }

        .input-field:focus {
            border-color: #1f6feb;
            box-shadow: 0 0 0 2px rgba(31, 111, 235, 0.2);
        }

        .send-button {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background-color: #1f6feb;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .send-button:hover {
            background-color: #1a5fcc;
        }

        .send-button:disabled {
            background-color: #30363d;
            cursor: not-allowed;
        }
/*
        .input-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        } */

        .action-button {
            width: 32px;
            height: 32px;
            border: 1px solid #30363d;
            border-radius: 4px;
            background-color: transparent;
            color: #8b949e;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .action-button:hover {
            background-color: #30363d;
            color: #c9d1d9;
        }

        /* Right Panel - Preview Area */
        .preview-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0d1117;
        }

        .preview-header {
            padding: 20px;
            border-bottom: 1px solid #30363d;
            background-color: #21262d;
        }

        .preview-tabs {
            display: flex;
            gap: 0;
            border-radius: 6px;
            background-color: #0d1117;
            padding: 4px;
        }

        .tab {
            flex: 1;
            padding: 8px 16px;
            border: none;
            background-color: transparent;
            color: #8b949e;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .tab.active {
            background-color: #1f6feb;
            color: white;
        }

        .tab:hover:not(.active) {
            background-color: #30363d;
            color: #c9d1d9;
        }

        .preview-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .preview-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: #8b949e;
            text-align: center;
            min-height: 0;
        }

        .preview-logo {
            font-size: 72px;
            font-weight: 300;
            color: #30363d;
            margin-bottom: 20px;
        }

        .file-tree {
            background-color: #21262d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            max-height: 200px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid #30363d;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
            position: relative;
        }

        .file-item:hover {
            background-color: #21262d;
        }

        .file-item.active {
            background-color: #1f6feb;
            color: white;
        }

        .file-item.active .file-icon {
            color: white;
        }

        .file-item .file-name {
            flex: 1;
            font-size: 14px;
            color: #c9d1d9;
        }

        .file-item:hover .file-name {
            color: #f0f6fc;
        }

        .file-item.active .file-name {
            color: white;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-download-btn {
            background: none;
            border: 1px solid #238636;
            border-radius: 4px;
            padding: 4px 6px;
            cursor: pointer;
            color: #238636;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: auto;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .file-item:hover .file-download-btn {
            opacity: 1;
        }

        .file-download-btn:hover {
            background-color: #238636;
            color: white;
            border-color: #238636;
            transform: translateY(-1px);
            box-shadow: 0 2px 4px rgba(35, 134, 54, 0.3);
        }

        .file-download-btn:active {
            transform: scale(0.95) translateY(0);
            box-shadow: 0 1px 2px rgba(35, 134, 54, 0.3);
        }

        .file-icon {
            width: 16px;
            height: 16px;
            color: #8b949e;
        }

        .file-name {
            flex: 1;
            font-size: 14px;
            color: #c9d1d9;
        }

        .file-content {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-x: auto;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .file-content pre {
            flex: 1;
            overflow-y: auto;
            margin: 0;
            padding: 0;
        }

        .file-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #30363d;
            color: #f0f6fc;
        }

        .file-header .file-icon {
            width: 16px;
            height: 16px;
            color: #8b949e;
        }

        .file-header strong {
            font-size: 14px;
            font-weight: 600;
        }

        .mode-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
        }

        .mode-badge.debug { background-color: #f85149; color: white; }
        .mode-badge.improve { background-color: #238636; color: white; }
        .mode-badge.generate { background-color: #1f6feb; color: white; }
        .mode-badge.misc { background-color: #9e6a03; color: white; }

        /* Feedback Buttons */
        .feedback-buttons {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .feedback-btn {
            background: none;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 4px 6px;
            cursor: pointer;
            color: #8b949e;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feedback-btn:hover {
            background-color: #21262d;
            color: #c9d1d9;
            border-color: #484f58;
        }

        .feedback-btn.thumbs-up:hover {
            color: #238636;
            border-color: #238636;
        }

        .feedback-btn.thumbs-down:hover {
            color: #f85149;
            border-color: #f85149;
        }

        .feedback-btn:active {
            transform: scale(0.95);
        }

        .feedback-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .feedback-btn.feedback-submitted {
            background-color: #21262d;
            border-color: #484f58;
            color: #8b949e;
        }

        .feedback-btn.feedback-success {
            background-color: #238636;
            border-color: #238636;
            color: white;
        }

        .feedback-btn.feedback-success.thumbs-down {
            background-color: #f85149;
            border-color: #f85149;
        }

        /* Execution Confirmation Styles */
        .execution-prompt {
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin: 15px 0;
            color: #c9d1d9;
        }

        .execution-prompt h4 {
            margin: 0 0 15px 0;
            color: #f0f6fc;
            font-size: 16px;
            font-weight: 600;
        }

        .execution-command {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.4;
            margin: 15px 0;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .execution-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .execution-btn {
            padding: 8px 16px;
            border: 1px solid #30363d;
            border-radius: 6px;
            background-color: transparent;
            color: #c9d1d9;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .execution-btn:hover {
            background-color: #30363d;
        }

        .execution-btn.primary {
            background-color: #1f6feb;
            border-color: #1f6feb;
            color: white;
        }

        .execution-btn.primary:hover {
            background-color: #1a5fcc;
        }

        .execution-btn.danger {
            background-color: #f85149;
            border-color: #f85149;
            color: white;
        }

        .execution-btn.danger:hover {
            background-color: #da3633;
        }

        /* Feedback Notification */
        .feedback-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px 16px;
            color: #c9d1d9;
            font-size: 14px;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Stream Output Styles */
        .stream-output {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
        }

        .stream-output h3 {
            margin: 0 0 15px 0;
            color: #f0f6fc;
            font-size: 16px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .stream-content {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            flex: 1;
            overflow-y: auto;
            color: #c9d1d9;
            min-height: 0;
        }

        .stream-line {
            margin-bottom: 4px;
            word-wrap: break-word;
        }

        .stream-line:last-child {
            margin-bottom: 0;
        }

        /* Stream container for trace history */
        .stream-container {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            max-height: 400px;
            overflow-y: auto;
        }

        .stream-header {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #30363d;
        }

        .stream-header h4 {
            color: #f0f6fc;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .stream-header p {
            color: #8b949e;
            font-size: 12px;
            margin: 0;
        }

        /* Trace View Styles */
        .trace-view-container {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .trace-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #30363d;
        }

        .trace-header h4 {
            color: #f0f6fc;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .trace-header p {
            color: #8b949e;
            font-size: 14px;
            margin: 0;
        }

        .trace-files-section,
        .trace-stream-section {
            margin-bottom: 20px;
        }

        .trace-files-section h5,
        .trace-stream-section h5 {
            color: #f0f6fc;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .trace-files-section .file-tree {
            max-height: 200px;
            overflow-y: auto;
        }

        .trace-stream-section .stream-container {
            max-height: 300px;
            overflow-y: auto;
        }

        /* Auto-scroll animation */
        .stream-content {
            scroll-behavior: smooth;
        }

        /* AI Summary Section Styles */
        .ai-summary-section {
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .ai-summary-section h3 {
            margin: 0 0 15px 0;
            color: #f0f6fc;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ai-summary-content p {
            margin: 0;
            color: #c9d1d9;
            line-height: 1.5;
            font-size: 14px;
        }

        /* Footer */
        .preview-footer {
            padding: 15px 20px;
            border-top: 1px solid #30363d;
            background-color: #21262d;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .footer-link {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #8b949e;
            text-decoration: none;
            font-size: 12px;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: #c9d1d9;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .chat-panel, .preview-panel {
                flex: none;
                height: 50vh;
            }
        }
    </style>
</head>

    <script>
        class GPTEngineerWebUI {
            constructor() {
                this.sessionId = localStorage.getItem('sessionId');
                this.isLoading = false;
                this.lastResult = null;
                this.streamHistory = [];
                this.eventSource = null;
                this.currentFiles = {};
                this.fileContents = {};
                this.feedbackStates = new Map(); // Store feedback state per trace
                this.promptFiles = new Map(); // Store files per prompt
                this.sessionTraces = new Map(); // Store trace data per session
                this.traceViewFiles = {}; // Store files for current trace view
                this.initializeElements();
                this.bindEvents();
                this.resetState();
                this.handlePageRefresh().catch(error => {
                    console.log('Page refresh handler error:', error);
                });
            }

            initializeElements() {
                this.chatMessages = document.getElementById('chatMessages');
                this.promptInput = document.getElementById('promptInput');
                this.sendButton = document.getElementById('sendButton');
                this.previewContent = document.getElementById('previewContent');
                this.codeTab = document.getElementById('codeTab');
                this.previewTab = document.getElementById('previewTab');
            }

            bindEvents() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                this.promptInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                this.codeTab.addEventListener('click', () => this.switchTab('code'));
                this.previewTab.addEventListener('click', () => this.switchTab('preview'));

                // Handle page refresh/visibility change
                window.addEventListener('beforeunload', () => this.cleanupOnExit());
                // Don't cleanup on visibility change - only on actual page unload
                // document.addEventListener('visibilitychange', () => {
                //     if (document.visibilityState === 'hidden') {
                //         this.cleanupOnExit();
                //     }
                // });
            }

            async sendMessage() {
                const prompt = this.promptInput.value.trim();
                if (!prompt || this.isLoading) return;

                this.isLoading = true;
                this.sendButton.disabled = true;
                this.promptInput.disabled = true;

                // Add user message
                this.addMessage(prompt, 'user');

                // Add loading indicator
                const loadingId = this.addLoadingMessage();

                try {
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            prompt: prompt,
                            session_id: this.sessionId
                        })
                    });

                    const result = await response.json();

                    // Remove loading indicator
                    this.removeLoadingMessage(loadingId);

                    if (result.success) {
                        this.sessionId = result.session_id;
                        localStorage.setItem('sessionId', result.session_id);
                        this.lastResult = result;

                        // Store trace data
                        if (result.trace_id) {
                            const traceData = {
                                prompt: prompt,
                                mode: result.mode,
                                files: result.files || {},
                                feedback: null,
                                timestamp: new Date().toISOString(),
                                ai_summary: result.ai_summary || null
                            };
                            this.sessionTraces.set(result.trace_id, traceData);

                            // Store files for this trace
                            if (result.files) {
                                this.promptFiles.set(result.trace_id, result.files);
                            }
                        }

                        this.addMessage(this.formatAgentResponse(result), 'agent', result.trace_id);
                        this.updateCodePreview(result.files);
                        this.startStreaming();
                        this.logSessionStats(); // Log session statistics
                    } else {
                        this.addMessage(`Error: ${result.error}`, 'agent');
                    }
                } catch (error) {
                    this.removeLoadingMessage(loadingId);
                    this.addMessage(`Error: ${error.message}`, 'agent');
                } finally {
                    this.isLoading = false;
                    this.sendButton.disabled = false;
                    this.promptInput.disabled = false;
                    this.promptInput.value = '';
                    this.promptInput.focus();
                }
            }

            addMessage(content, type, traceId = null) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}`;

                // Make agent messages clickable if they have files or stream history
                if (type === 'agent' && traceId) {
                    messageDiv.classList.add('clickable');
                    messageDiv.setAttribute('data-trace-id', traceId);

                    // Add click handler to show files and stream history
                    messageDiv.addEventListener('click', (e) => {
                        // Don't trigger if clicking feedback buttons
                        if (!e.target.closest('.feedback-buttons')) {
                            // Load both files and stream history for this trace
                            this.loadTraceData(traceId);
                        }
                    });
                }

                const timestamp = new Date().toLocaleTimeString();

                // Add feedback buttons for agent messages
                let feedbackButtons = '';
                if (type === 'agent' && traceId) {
                    const currentFeedback = this.feedbackStates.get(traceId);
                    feedbackButtons = `
                        <div class="feedback-buttons">
                            <button class="feedback-btn thumbs-up${currentFeedback === 1 ? ' feedback-success' : ''}"
                                data-trace-id="${traceId}"
                                data-feedback="1"
                                title="${currentFeedback === 1 ? 'Change feedback' : 'Good response'}">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 9V5a3 3 0 0 0-6 0v4H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-2z"/>
                                </svg>
                            </button>
                            <button class="feedback-btn thumbs-down${currentFeedback === 0 ? ' feedback-success' : ''}"
                                data-trace-id="${traceId}"
                                data-feedback="0"
                                title="${currentFeedback === 0 ? 'Change feedback' : 'Poor response'}">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M10 15v4a3 3 0 0 0 6 0v-4h2a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-2z"/>
                                </svg>
                            </button>
                        </div>
                    `;
                }

                messageDiv.innerHTML = `
                    <div class="message-header">
                        <span>${type === 'user' ? 'You' : 'GPT Engineer'}</span>
                        <span>${timestamp}</span>
                        ${feedbackButtons}
                    </div>
                    <div class="message-content">${content}</div>
                    ${type === 'agent' && traceId ? '<div class="message-files-indicator">Click to view files & CLI output</div>' : ''}
                `;

                this.chatMessages.appendChild(messageDiv);
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;

                // Add event listeners to feedback buttons
                if (type === 'agent' && traceId) {
                    const feedbackButtons = messageDiv.querySelectorAll('.feedback-btn');
                    feedbackButtons.forEach(button => {
                        button.addEventListener('click', (e) => {
                            e.preventDefault();
                            const traceId = button.getAttribute('data-trace-id');
                            const feedbackScore = parseInt(button.getAttribute('data-feedback'));
                            this.submitFeedback(traceId, feedbackScore, button);
                        });
                    });
                }
            }

            addLoadingMessage() {
                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'loading';
                loadingDiv.id = 'loading-' + Date.now();

                loadingDiv.innerHTML = `
                    <div>GPT Engineer is thinking</div>
                    <div class="loading-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                `;

                this.chatMessages.appendChild(loadingDiv);
                this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
                return loadingDiv.id;
            }

            removeLoadingMessage(loadingId) {
                const loadingElement = document.getElementById(loadingId);
                if (loadingElement) {
                    loadingElement.remove();
                }
            }

            formatAgentResponse(result) {
                let response = '';
                // Add AI-generated summary
                if (result.ai_summary) {
                    response += `${result.ai_summary}\n\n`;
                }
                response += `Files generated: ${result.files_count}\n`;
                if (result.files && Object.keys(result.files).length > 0) {
                    response += 'Generated files:\n';
                    for (const [filename, content] of Object.entries(result.files)) {
                        response += `• ${filename}\n`;
                    }
                }

                return response;
            }

            async submitFeedback(traceId, feedbackScore, button = null) {
                console.log(`🚀 Submitting feedback - Trace ID: ${traceId}, Score: ${feedbackScore}, Session ID: ${this.sessionId}`);

                try {
                    // Check if this is a feedback change
                    const currentFeedback = this.feedbackStates.get(traceId);
                    const isChangingFeedback = currentFeedback !== undefined;

                    // If changing feedback, update all buttons in the feedback group
                    const feedbackGroup = button?.closest('.feedback-buttons');
                    const allButtons = feedbackGroup?.querySelectorAll('.feedback-btn') || [];

                    // Disable all buttons in the group
                    allButtons.forEach(btn => {
                        btn.disabled = true;
                        btn.classList.add('feedback-submitted');
                    });

                    const requestBody = {
                        session_id: this.sessionId,
                        trace_id: traceId,
                        feedback_score: feedbackScore,
                        is_update: isChangingFeedback
                    };

                    console.log('📤 Sending feedback request:', requestBody);

                    const response = await fetch('/api/feedback', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(requestBody)
                    });

                    console.log('📥 Received response status:', response.status);

                    const result = await response.json();
                    console.log('📋 Response data:', result);

                    if (result.success) {
                        console.log('✅ Feedback submitted successfully');

                        // Update feedback state
                        this.feedbackStates.set(traceId, feedbackScore);

                        // Show feedback confirmation
                        const feedbackText = isChangingFeedback
                            ? (feedbackScore === 1 ? '👍 Feedback updated to positive!' : '👎 Feedback updated to negative!')
                            : (feedbackScore === 1 ? '👍 Thank you for your positive feedback!' : '👎 Thank you for your feedback!');
                        this.showFeedbackConfirmation(feedbackText);

                        // Update button appearances
                        allButtons.forEach(btn => {
                            btn.classList.remove('feedback-success');
                            btn.disabled = false;
                            if (parseInt(btn.getAttribute('data-feedback')) === feedbackScore) {
                                btn.classList.add('feedback-success');
                            }
                        });

                        console.log('🎨 Buttons styled for success');
                    } else {
                        console.error('❌ Feedback submission failed:', result.error);

                        // Re-enable buttons if submission failed
                        allButtons.forEach(btn => {
                            btn.disabled = false;
                            btn.classList.remove('feedback-submitted');
                        });
                        console.log('🔄 Buttons re-enabled due to failure');
                    }
                } catch (error) {
                    console.error('💥 Error submitting feedback:', error);
                    console.error('Error details:', {
                        message: error.message,
                        stack: error.stack,
                        traceId: traceId,
                        feedbackScore: feedbackScore,
                        sessionId: this.sessionId
                    });

                    // Re-enable buttons if there was an error
                    const feedbackGroup = button?.closest('.feedback-buttons');
                    const allButtons = feedbackGroup?.querySelectorAll('.feedback-btn') || [];
                    allButtons.forEach(btn => {
                        btn.disabled = false;
                        btn.classList.remove('feedback-submitted');
                    });
                    console.log('🔄 Buttons re-enabled due to error');
                }
            }

            showFeedbackConfirmation(message) {
                // Create a temporary notification
                const notification = document.createElement('div');
                notification.className = 'feedback-notification';
                notification.textContent = message;
                document.body.appendChild(notification);

                // Remove after 3 seconds
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }

            updateCodePreview(files) {
                if (files && Object.keys(files).length > 0) {
                    let previewHTML = '<div class="file-tree">';
                    previewHTML += '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">';
                    previewHTML += '<h3>Generated Files</h3>';
                    previewHTML += '<button class="file-download-btn" onclick="window.gptEngineerUI.downloadAllFiles()" title="Download all files">';
                    previewHTML += '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">';
                    previewHTML += '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>';
                    previewHTML += '<polyline points="7,10 12,15 17,10"/>';
                    previewHTML += '<line x1="12" y1="15" x2="12" y2="3"/>';
                    previewHTML += '</svg>';
                    previewHTML += ' Download All';
                    previewHTML += '</button>';
                    previewHTML += '</div>';

                    // Store file contents and create clickable file list
                    let isFirst = true;
                    this.fileContents = {};  // Reset file contents

                    for (const [filename, content] of Object.entries(files)) {
                        const activeClass = isFirst ? ' active' : '';
                        const escapedFilename = this.escapeHtml(filename);
                        // Store the content in our fileContents object
                        this.fileContents[filename] = content;

                        previewHTML += `
                            <div class="file-item${activeClass}" data-filename="${escapedFilename}">
                                <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14,2 14,8 20,8"/>
                                </svg>
                                <span class="file-name">${filename}</span>
                                <button class="file-download-btn" data-filename="${escapedFilename}" title="Download file">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                        <polyline points="7,10 12,15 17,10"/>
                                        <line x1="12" y1="15" x2="12" y2="3"/>
                                    </svg>
                                </button>
                            </div>
                        `;
                        isFirst = false;
                    }

                    previewHTML += '</div>';

                    // Show first file content by default
                    const firstFile = Object.entries(files)[0];
                    if (firstFile) {
                        const [filename, content] = firstFile;
                        previewHTML += `
                            <div class="file-content" id="fileContent">
                                <div class="file-header">
                                    <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                        <polyline points="14,2 14,8 20,8"/>
                                    </svg>
                                    <strong>${filename}</strong>
                                    <button class="file-download-btn" onclick="window.gptEngineerUI.downloadFile('${this.escapeHtml(filename)}', \`${this.escapeHtml(content)}\`)">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                            <polyline points="7,10 12,15 17,10"/>
                                            <line x1="12" y1="15" x2="12" y2="3"/>
                                        </svg>
                                    </button>
                                </div>
                                <pre>${this.escapeHtml(content)}</pre>
                            </div>
                        `;
                    }

                    this.previewContent.innerHTML = previewHTML;

                    // Add click event listeners to file items
                    const fileItems = this.previewContent.querySelectorAll('.file-item');
                    fileItems.forEach(item => {
                        item.addEventListener('click', (e) => {
                            // Don't trigger if clicking download button
                            if (!e.target.closest('.file-download-btn')) {
                                const filename = item.getAttribute('data-filename');
                                const content = this.fileContents[filename];
                                this.selectFile(filename, content);
                            }
                        });
                    });

                    // Add event listeners to download buttons
                    const downloadButtons = this.previewContent.querySelectorAll('.file-download-btn');
                    downloadButtons.forEach(button => {
                        button.addEventListener('click', (e) => {
                            e.stopPropagation(); // Prevent triggering file view
                            const filename = button.getAttribute('data-filename');
                            const content = this.fileContents[filename];
                            if (filename && content) {
                                this.downloadFile(filename, content);
                            }
                        });
                    });

                    // Store files for later access
                    this.currentFiles = files;
                } else {
                    this.previewContent.innerHTML = `
                        <div class="preview-placeholder">
                            <div class="preview-logo">📄</div>
                            <div>No files generated yet</div>
                        </div>
                    `;
                }
            }

            selectFile(filename, content) {
                // Update file content display
                const fileContent = document.getElementById('fileContent');
                if (fileContent) {
                    fileContent.innerHTML = `
                        <div class="file-header">
                            <svg class="file-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14,2 14,8 20,8"/>
                            </svg>
                            <strong>${filename}</strong>
                            <button class="file-download-btn" onclick="window.gptEngineerUI.downloadFile('${this.escapeHtml(filename)}', \`${this.escapeHtml(content)}\`)">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="7,10 12,15 17,10"/>
                                    <line x1="12" y1="15" x2="12" y2="3"/>
                                </svg>
                            </button>
                        </div>
                        <pre>${this.escapeHtml(content)}</pre>
                    `;
                }

                // Update active file item styling
                const fileItems = document.querySelectorAll('.file-item');
                fileItems.forEach(item => {
                    item.classList.remove('active');
                    const itemFilename = item.getAttribute('data-filename');
                    if (itemFilename === filename) {
                        item.classList.add('active');
                    }
                });
            }

            updateStreamPreview() {
                if (this.streamHistory.length > 0) {
                    let previewHTML = '<div class="stream-output">';
                    previewHTML += '<h3>CLI Output</h3>';
                    previewHTML += '<div class="stream-content">';

                    let executionPromptShown = false;
                    let commandToExecute = null;

                    for (const message of this.streamHistory) {
                        // Check if this is an execution confirmation prompt
                        if (message.includes("Do you want to execute this code? (Y/n)")) {
                            executionPromptShown = true;
                            // Look for the command in the next few messages
                            const currentIndex = this.streamHistory.indexOf(message);
                            for (let i = currentIndex + 1; i < Math.min(currentIndex + 5, this.streamHistory.length); i++) {
                                const nextMessage = this.streamHistory[i];
                                if (nextMessage && nextMessage.trim() && !nextMessage.includes("Do you want to execute this code?")) {
                                    commandToExecute = nextMessage;
                                    break;
                                }
                            }
                            break;
                        }
                        previewHTML += `<div class="stream-line">${this.escapeHtml(message)}</div>`;
                    }

                    previewHTML += '</div></div>';

                    // If execution confirmation was detected, add the prompt
                    if (executionPromptShown && commandToExecute) {
                        previewHTML += `
                            <div class="execution-prompt">
                                <h4>Execute Code?</h4>
                                <p>The following code will be executed:</p>
                                <div class="execution-command">${this.escapeHtml(commandToExecute)}</div>
                                <div class="execution-buttons">
                                    <button class="execution-btn danger" onclick="window.gptEngineerUI.handleExecution(false)">No</button>
                                    <button class="execution-btn primary" onclick="window.gptEngineerUI.handleExecution(true)">Yes</button>
                                </div>
                            </div>
                        `;
                    }

                    this.previewContent.innerHTML = previewHTML;
                    this.scrollToBottom();
                } else {
                    this.previewContent.innerHTML = `
                        <div class="preview-placeholder">
                            <div class="preview-logo">🖥️</div>
                            <div>CLI output will appear here</div>
                        </div>
                    `;
                }
            }

            startStreaming() {
                if (!this.sessionId) return;

                // Close existing connection
                if (this.eventSource) {
                    this.eventSource.close();
                }

                // Start new SSE connection
                this.eventSource = new EventSource(`/api/stream/${this.sessionId}`);

                this.eventSource.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);

                        if (data.type === 'message') {
                            this.streamHistory.push(data.message);
                            this.updateStreamPreview();
                        } else if (data.type === 'stream_cleared') {
                            // Clear the stream display when stream is cleared
                            this.streamHistory = [];
                            this.updateStreamPreview();
                            console.log('Stream cleared');
                        } else if (data.type === 'connected') {
                            console.log('Stream connected');
                        } else if (data.type === 'ping') {
                            // Keep connection alive
                        }
                    } catch (error) {
                        console.error('Error parsing stream data:', error);
                    }
                };

                this.eventSource.onerror = (error) => {
                    console.error('Stream error:', error);
                    // Don't close immediately, let it try to reconnect
                    setTimeout(() => {
                        if (this.eventSource && this.eventSource.readyState === EventSource.CLOSED) {
                            console.log('Attempting to reconnect stream...');
                            this.startStreaming();
                        }
                    }, 1000);
                };

                this.eventSource.onopen = () => {
                    console.log('Stream connection opened');
                };
            }

            scrollToBottom() {
                const streamContent = this.previewContent.querySelector('.stream-content');
                if (streamContent) {
                    streamContent.scrollTop = streamContent.scrollHeight;
                }
            }

            resetState() {
                // Reset all state variables
                this.sessionId = null;
                localStorage.removeItem('sessionId');
                this.isLoading = false;
                this.lastResult = null;
                this.streamHistory = [];
                this.fileContents = {};
                this.promptFiles.clear();
                this.feedbackStates.clear();
                this.sessionTraces.clear();
                this.traceViewFiles = {};

                // Close any existing event source
                if (this.eventSource) {
                    this.eventSource.close();
                    this.eventSource = null;
                }

                // Clear chat messages
                this.chatMessages.innerHTML = '';

                // Reset preview content
                this.previewContent.innerHTML = `
                    <div class="preview-placeholder">
                        <div class="preview-logo">🖥️</div>
                        <div>CLI output will appear here</div>
                    </div>
                `;

                // Reset tabs to preview
                this.codeTab.classList.remove('active');
                this.previewTab.classList.add('active');

                console.log('Agent state reset - ready for new session');
            }

            async handleExecution(execute) {
                if (!this.sessionId) return;

                try {
                    const response = await fetch('/api/execute', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            session_id: this.sessionId,
                            confirm: execute
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        if (execute) {
                            this.addMessage(`Code executed successfully. ${result.message}`, 'agent');
                        } else {
                            this.addMessage(`Execution declined. ${result.message}`, 'agent');
                        }
                        // Restart streaming to get updated output
                        this.startStreaming();
                    } else {
                        this.addMessage(`Error: ${result.error}`, 'agent');
                    }
                } catch (error) {
                    this.addMessage(`Error during execution: ${error.message}`, 'agent');
                }
            }

            async handlePageRefresh() {
                // Clean up any existing sessions on page load
                try {
                    await fetch('/api/reset', {
                        method: 'POST'
                    });
                } catch (error) {
                    console.log('Reset error (expected on first load):', error);
                }

                // Load session history if we have a session ID
                if (this.sessionId) {
                    await this.loadSessionHistory();
                } else {
                    // Add a welcome message when page loads
                    this.addMessage('Welcome to GPT Engineer! Start by typing a prompt below.', 'agent');
                }
            }

            async cleanupOnExit() {
                // Clean up current session if exists
                if (this.sessionId) {
                    try {
                        await fetch(`/api/session/${this.sessionId}`, {
                            method: 'DELETE'
                        });
                    } catch (error) {
                        console.log('Cleanup error (expected on page refresh):', error);
                    }
                }

                // Close event source
                if (this.eventSource) {
                    this.eventSource.close();
                }
            }

            async loadSessionHistory() {
                try {
                    const response = await fetch(`/api/session/${this.sessionId}/history`);
                    const result = await response.json();

                    if (result.success && result.session) {
                        const session = result.session;

                        // Load traces
                        for (const traceData of session.traces) {
                            const traceId = traceData.trace_id;

                            // Store trace data
                            this.sessionTraces.set(traceId, {
                                prompt: traceData.prompt,
                                mode: traceData.mode,
                                files: traceData.files || {},
                                feedback: traceData.feedback,
                                timestamp: new Date(traceData.created_at * 1000).toISOString(),
                                ai_summary: traceData.execution_result?.ai_summary || null
                            });

                            // Store files
                            if (traceData.files) {
                                this.promptFiles.set(traceId, traceData.files);
                            }

                            // Store feedback state
                            if (traceData.feedback !== null) {
                                this.feedbackStates.set(traceId, traceData.feedback);
                            }

                            // Add messages to UI
                            this.addMessage(traceData.prompt, 'user');
                            this.addMessage(this.formatAgentResponse({
                                mode: traceData.mode,
                                files: traceData.files,
                                files_count: Object.keys(traceData.files || {}).length
                            }), 'agent', traceId);
                        }

                        // Update current files
                        if (session.current_files) {
                            this.currentFiles = session.current_files;
                            this.updateCodePreview(session.current_files);
                        }

                        console.log(`✅ Loaded session history with ${session.traces.length} traces`);
                        this.logSessionStats(); // Log session statistics after loading
                    }
                } catch (error) {
                    console.log('Error loading session history:', error);
                    // Add welcome message if loading fails
                    this.addMessage('Welcome to GPT Engineer! Start by typing a prompt below.', 'agent');
                }
            }

            switchTab(tab) {
                this.codeTab.classList.toggle('active', tab === 'code');
                this.previewTab.classList.toggle('active', tab === 'preview');

                if (tab === 'code') {
                    this.showCodeView();
                } else {
                    this.showPreviewView();
                }
            }

            showCodeView() {
                // Show generated files in code view
                if (this.lastResult && this.lastResult.files) {
                    this.updateCodePreview(this.lastResult.files);
                } else {
                    this.previewContent.innerHTML = `
                        <div class="preview-placeholder">
                            <div class="preview-logo">📄</div>
                            <div>Generated files will appear here</div>
                        </div>
                    `;
                }
            }

            showPreviewView() {
                // Show streaming output in preview view
                this.updateStreamPreview();
            }

            getLastMode() {
                // This would track the last mode used
                return '';
            }

            getTraceInfo(traceId) {
                return this.sessionTraces.get(traceId) || null;
            }

            getAllTraces() {
                return Array.from(this.sessionTraces.entries()).map(([traceId, data]) => ({
                    traceId,
                    ...data
                }));
            }

            logSessionStats() {
                console.log('📊 Session Statistics:');
                console.log(`- Session ID: ${this.sessionId}`);
                console.log(`- Total Traces: ${this.sessionTraces.size}`);
                console.log(`- Total Files: ${this.promptFiles.size}`);
                console.log(`- Feedback States: ${this.feedbackStates.size}`);
                console.log(`- Stream History Length: ${this.streamHistory.length}`);

                const traces = this.getAllTraces();
                traces.forEach((trace, index) => {
                    console.log(`  Trace ${index + 1}:`, {
                        traceId: trace.traceId,
                        mode: trace.mode,
                        filesCount: Object.keys(trace.files).length,
                        feedback: trace.feedback,
                        timestamp: trace.timestamp
                    });
                });
            }

            async loadTraceData(traceId) {
                if (!this.sessionId || !traceId) return;

                // Get files for this trace
                const files = this.promptFiles.get(traceId);

                // Load stream history
                let streamMessages = [];
                try {
                    const response = await fetch(`/api/stream/${this.sessionId}/trace/${traceId}/history`);
                    const result = await response.json();

                    if (result.success && result.messages) {
                        streamMessages = result.messages;
                        console.log(`✅ Loaded stream history for trace ${traceId} with ${result.messages.length} messages`);
                    } else {
                        console.log(`No stream history found for trace ${traceId}`);
                    }
                } catch (error) {
                    console.error(`Error loading trace stream history: ${error}`);
                }

                // Show combined view with both files and stream history
                this.showCombinedTraceView(traceId, files, streamMessages);
            }

            showCombinedTraceView(traceId, files, streamMessages) {
                // Switch to preview tab for the combined view
                this.switchTab('preview');

                // Store files for this trace view
                this.traceViewFiles = files || {};

                let previewHTML = `
                    <div class="trace-view-container">
                        <div class="trace-header">
                            <h4>Prompt Details</h4>
                            <p>Showing files and CLI output for this specific prompt</p>
                        </div>
                `;

                // Add files section if files exist
                if (files && Object.keys(files).length > 0) {
                    previewHTML += `
                        <div class="trace-files-section">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                <h5>Generated Files (${Object.keys(files).length})</h5>
                                <button class="file-download-btn" onclick="window.gptEngineerUI.downloadAllFilesFromTrace()" title="Download all files">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="white" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                        <polyline points="7,10 12,15 17,10"/>
                                        <line x1="12" y1="15" x2="12" y2="3"/>
                                    </svg>
                                    Download All
                                </button>
                            </div>
                            <div class="file-tree">
                    `;

                    for (const [filename, content] of Object.entries(files)) {
                        previewHTML += `
                            <div class="file-item" data-filename="${this.escapeHtml(filename)}">
                                <span class="file-icon">📄</span>
                                <span class="file-name">${this.escapeHtml(filename)}</span>
                                <button class="file-download-btn" data-filename="${this.escapeHtml(filename)}" title="Download file">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                        <polyline points="7,10 12,15 17,10"/>
                                        <line x1="12" y1="15" x2="12" y2="3"/>
                                    </svg>
                                </button>
                            </div>
                        `;
                    }

                    previewHTML += `
                            </div>
                        </div>
                    `;
                }

                // Add stream history section
                if (streamMessages.length > 0) {
                    previewHTML += `
                        <div class="trace-stream-section">
                            <h5>CLI Output</h5>
                            <div class="stream-container">
                                <div class="stream-content">
                    `;

                    for (const message of streamMessages) {
                        previewHTML += `<div class="stream-line">${this.escapeHtml(message)}</div>`;
                    }

                    previewHTML += `
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    previewHTML += `
                        <div class="trace-stream-section">
                            <h5>CLI Output</h5>
                            <div class="stream-container">
                                <div class="stream-content">
                                    <div class="stream-line">No CLI output available for this prompt</div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                previewHTML += '</div>';
                this.previewContent.innerHTML = previewHTML;

                // Add event listeners to file items
                const fileItems = this.previewContent.querySelectorAll('.file-item');
                fileItems.forEach(item => {
                    item.addEventListener('click', (e) => {
                        // Don't trigger if clicking download button
                        if (!e.target.closest('.file-download-btn')) {
                            const filename = item.getAttribute('data-filename');
                            if (filename && this.traceViewFiles[filename]) {
                                this.showFileContent(filename, this.traceViewFiles[filename]);
                            }
                        }
                    });
                });

                // Add event listeners to download buttons
                const downloadButtons = this.previewContent.querySelectorAll('.file-download-btn');
                downloadButtons.forEach(button => {
                    button.addEventListener('click', (e) => {
                        e.stopPropagation(); // Prevent triggering file view
                        const filename = button.getAttribute('data-filename');
                        if (filename && this.traceViewFiles[filename]) {
                            this.downloadFile(filename, this.traceViewFiles[filename]);
                        }
                    });
                });
            }

            showFileContent(filename, content) {
                // Switch to code tab and show the specific file
                this.switchTab('code');
                this.updateCodePreview({ [filename]: content });
            }

            downloadFile(filename, content) {
                // Create a blob with the file content
                const blob = new Blob([content], { type: 'text/plain' });

                // Create a download link
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;

                // Trigger download
                document.body.appendChild(a);
                a.click();

                // Clean up
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);

                console.log(`✅ Downloaded file: ${filename}`);
            }

            downloadAllFiles() {
                if (!this.currentFiles || Object.keys(this.currentFiles).length === 0) {
                    console.log('No files to download');
                    return;
                }

                // Create a zip file using JSZip
                if (typeof JSZip === 'undefined') {
                    // Fallback: download files one by one
                    console.log('JSZip not available, downloading files individually...');
                    for (const [filename, content] of Object.entries(this.currentFiles)) {
                        this.downloadFile(filename, content);
                    }
                    return;
                }

                const zip = new JSZip();

                // Add all files to the zip
                for (const [filename, content] of Object.entries(this.currentFiles)) {
                    zip.file(filename, content);
                }

                // Generate and download the zip file
                zip.generateAsync({ type: 'blob' }).then((blob) => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'gpt-engineer-files.zip';

                    // Trigger download
                    document.body.appendChild(a);
                    a.click();

                    // Clean up
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);

                    console.log(`✅ Downloaded all files as zip`);
                }).catch((error) => {
                    console.error('Error creating zip file:', error);
                    // Fallback: download files one by one
                    for (const [filename, content] of Object.entries(this.currentFiles)) {
                        this.downloadFile(filename, content);
                    }
                });
            }

            downloadAllFilesFromTrace() {
                if (!this.traceViewFiles || Object.keys(this.traceViewFiles).length === 0) {
                    console.log('No files to download from trace');
                    return;
                }

                // Create a zip file using JSZip
                if (typeof JSZip === 'undefined') {
                    // Fallback: download files one by one
                    console.log('JSZip not available, downloading files individually...');
                    for (const [filename, content] of Object.entries(this.traceViewFiles)) {
                        this.downloadFile(filename, content);
                    }
                    return;
                }

                const zip = new JSZip();

                // Add all files to the zip
                for (const [filename, content] of Object.entries(this.traceViewFiles)) {
                    zip.file(filename, content);
                }

                // Generate and download the zip file
                zip.generateAsync({ type: 'blob' }).then((blob) => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'gpt-engineer-trace-files.zip';

                    // Trigger download
                    document.body.appendChild(a);
                    a.click();

                    // Clean up
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(url);

                    console.log(`✅ Downloaded all trace files as zip`);
                }).catch((error) => {
                    console.error('Error creating zip file:', error);
                    // Fallback: download files one by one
                    for (const [filename, content] of Object.entries(this.traceViewFiles)) {
                        this.downloadFile(filename, content);
                    }
                });
            }

            async loadTraceStreamHistory(traceId) {
                if (!this.sessionId || !traceId) return;

                try {
                    const response = await fetch(`/api/stream/${this.sessionId}/trace/${traceId}/history`);
                    const result = await response.json();

                    if (result.success && result.messages) {
                        // Switch to preview tab to show stream history
                        this.switchTab('preview');

                        // Update the stream preview with trace-specific history
                        this.updateStreamPreviewWithHistory(result.messages);

                        console.log(`✅ Loaded stream history for trace ${traceId} with ${result.messages.length} messages`);
                    } else {
                        console.log(`No stream history found for trace ${traceId}`);
                        // Show a message that no stream history is available
                        this.updateStreamPreviewWithHistory([]);
                    }
                } catch (error) {
                    console.error(`Error loading trace stream history: ${error}`);
                    this.updateStreamPreviewWithHistory([]);
                }
            }

            updateStreamPreviewWithHistory(messages) {
                if (messages.length === 0) {
                    this.previewContent.innerHTML = `
                        <div class="preview-placeholder">
                            <div class="preview-logo">📝</div>
                            <div>No CLI output available for this prompt</div>
                        </div>
                    `;
                    return;
                }

                let previewHTML = `
                    <div class="stream-container">
                        <div class="stream-header">
                            <h4>CLI Output History</h4>
                            <p>Showing output from this specific prompt</p>
                        </div>
                        <div class="stream-content">
                `;

                let executionPromptShown = false;
                let commandToExecute = null;

                for (const message of messages) {
                    // Check if this is an execution confirmation prompt
                    if (message.includes("Do you want to execute this code? (Y/n)")) {
                        executionPromptShown = true;
                        // Look for the command in the next few messages
                        const currentIndex = messages.indexOf(message);
                        for (let i = currentIndex + 1; i < Math.min(currentIndex + 5, messages.length); i++) {
                            const nextMessage = messages[i];
                            if (nextMessage && nextMessage.trim() && !nextMessage.includes("Do you want to execute this code?")) {
                                commandToExecute = nextMessage;
                                break;
                            }
                        }
                        break;
                    }
                    previewHTML += `<div class="stream-line">${this.escapeHtml(message)}</div>`;
                }

                previewHTML += '</div></div>';

                // If execution confirmation was detected, add the prompt
                if (executionPromptShown && commandToExecute) {
                    previewHTML += `
                        <div class="execution-prompt">
                            <h4>Execute Code?</h4>
                            <p>The following code will be executed:</p>
                            <div class="execution-command">${this.escapeHtml(commandToExecute)}</div>
                            <div class="execution-buttons">
                                <button class="execution-btn danger" onclick="window.gptEngineerUI.handleExecution(false)">No</button>
                                <button class="execution-btn primary" onclick="window.gptEngineerUI.handleExecution(true)">Yes</button>
                            </div>
                        </div>
                    `;
                }

                this.previewContent.innerHTML = previewHTML;
                this.scrollToBottom();
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize the web UI when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            window.gptEngineerUI = new GPTEngineerWebUI();
        });
    </script>
</body>
</html>
